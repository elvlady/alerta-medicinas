<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#177d6b">
  <title>Alerta Medicinas</title>
  <link rel="manifest" href="/manifest.webmanifest?v=25">
  <link rel="stylesheet" href="/styles.css?v=25">
  <script type="module" src="/app.js?v=25"></script>
</head>
<body>
  <section class="auth-view" id="auth-view" hidden>
    <form class="auth-panel" id="auth-form">
      <p class="eyebrow" id="auth-eyebrow">Cuenta</p>
      <h1 id="auth-title">Entrar</h1>
      <label>
        <span>Usuario</span>
        <input id="auth-username" autocomplete="username" required>
      </label>
      <label id="name-field" hidden>
        <span>Nombre</span>
        <input id="auth-name" autocomplete="name">
      </label>
      <label>
        <span>Contrasena</span>
        <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <button class="primary" type="submit" id="auth-submit">Entrar</button>
      <p class="message" id="auth-message"></p>
    </form>
  </section>

  <section class="app-view" id="app-view" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow">Recordatorios</p>
        <h1>Alerta Medicinas</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="push-button" class="push-switch" aria-pressed="false">
          <span>Alertas</span>
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </button>
        <span id="push-status" class="sr-only">Listo para activar</span>
        <button type="button" id="logout-button" hidden>Salir</button>
      </div>
    </header>

    <main class="shell">
      <section class="panel treatment-panel" id="treatment-panel">
        <div class="form-heading">
          <div>
            <p class="eyebrow">Tratamiento</p>
            <h2 id="treatment-form-title">Nuevo tratamiento</h2>
          </div>
          <button type="button" id="treatment-close-form-button">Cerrar</button>
        </div>
        <form class="treatment-form" id="treatment-form">
          <input type="hidden" id="treatment-id">
          <label class="field-full">
            <span>Nombre</span>
            <input id="treatment-name" required placeholder="Antibiotico">
          </label>
          <label class="field-compact">
            <span>Fecha inicio</span>
            <input id="treatment-start-date" type="date" required>
          </label>
          <label class="field-compact">
            <span>Fecha termino</span>
            <input id="treatment-end-date" type="date" required>
          </label>
          <div class="form-actions">
            <button class="primary" type="submit" id="treatment-save-button">Guardar</button>
          </div>
        </form>
      </section>

      <section class="panel medicine-panel" id="medicine-panel">
        <div class="form-heading">
          <div>
            <p class="eyebrow">Medicina</p>
            <h2 id="form-title">Nueva medicina</h2>
          </div>
          <button type="button" id="close-form-button">Cerrar</button>
        </div>
        <form class="medicine-form" id="medicine-form">
          <input type="hidden" id="medicine-id">
          <label class="field-full">
            <span>Nombre</span>
            <input id="medicine-name" required placeholder="Metformina">
          </label>
          <label class="field-full">
            <span>Dosis</span>
            <input id="medicine-dose" placeholder="1 tableta">
          </label>
          <label class="field-compact">
            <span>Hora de inicio</span>
            <input id="medicine-start-time" type="time" required>
          </label>
          <label class="field-compact">
            <span>Cada horas</span>
            <input id="medicine-interval" type="number" min="1" max="168" required placeholder="8">
          </label>
          <label class="field-compact">
            <span>Por tantos dias</span>
            <input id="medicine-duration" type="number" min="1" max="3650" required placeholder="7">
          </label>
          <label class="field-full">
            <span>Notas</span>
            <input id="medicine-notes" placeholder="Despues de comer">
          </label>
          <label class="checkline">
            <input id="medicine-active" type="checkbox" checked>
            <span>Activa</span>
          </label>
          <div class="form-actions">
            <button class="primary" type="submit" id="save-button">Guardar</button>
            <button type="button" id="cancel-edit" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      <div class="view-viewport">
        <div class="view-slider" id="view-slider">
          <section class="treatments-view" id="treatments-view">
            <div class="treatments-header">
              <div>
                <p class="eyebrow">Tratamientos</p>
                <h2>Mis tratamientos</h2>
              </div>
              <strong id="treatment-count">0 tratamientos</strong>
            </div>
            <section class="treatment-list" id="treatment-list"></section>
          </section>

          <section class="schedule-view" id="schedule-view">
            <div class="detail-header">
              <button type="button" id="back-to-treatments" class="back-button" aria-label="Volver a tratamientos">&lsaquo;</button>
              <div>
                <p class="eyebrow">Tratamiento</p>
                <h2 id="selected-treatment-name">Tratamiento</h2>
                <span id="selected-treatment-range"></span>
              </div>
            </div>
            <section class="medicine-list" id="medicine-list"></section>
          </section>
        </div>
      </div>
    </main>
    <button type="button" class="fab-button" id="fab-button" aria-label="Agregar medicina">+</button>
  </section>
</body>
</html>
