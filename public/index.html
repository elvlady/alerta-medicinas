<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#177d6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alerta Medicinas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Alerta Medicinas</title>
  <link rel="manifest" href="/manifest.webmanifest?v=35">
  <link rel="preload" as="image" href="/iconos/android/mipmap-xxxhdpi/ic_launcher.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/iconos/Assets.xcassets/AppIcon.appiconset/16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/iconos/Assets.xcassets/AppIcon.appiconset/32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/iconos/android/mipmap-xxxhdpi/ic_launcher.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/iconos/Assets.xcassets/AppIcon.appiconset/152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/iconos/Assets.xcassets/AppIcon.appiconset/167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/iconos/Assets.xcassets/AppIcon.appiconset/180.png">
  <style>
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      background: #f7f9f8;
      color: #25334b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
      transition: opacity .22s ease, visibility .22s ease;
    }

    .splash-screen.is-done {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .splash-card {
      width: min(240px, 86vw);
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
    }

    .splash-icon {
      width: 86px;
      height: 86px;
      border-radius: 24px;
      box-shadow: 0 18px 34px rgba(23, 125, 107, .2);
    }

    .splash-title {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
    }

    .splash-bar {
      width: 126px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(37, 51, 75, .1);
    }

    .splash-bar span {
      width: 44%;
      height: 100%;
      display: block;
      border-radius: inherit;
      background: #177d6b;
      animation: splash-slide 1.15s ease-in-out infinite;
    }

    .splash-message {
      min-height: 18px;
      margin: 0;
      color: #788392;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .splash-reload {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      background: #177d6b;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      padding: 10px 18px;
    }

    @keyframes splash-slide {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(70%); }
      100% { transform: translateX(250%); }
    }
  </style>
  <link rel="stylesheet" href="/styles.css?v=35">
  <script type="module" src="/app.js?v=35"></script>
</head>
<body>
  <section class="splash-screen" id="splash-screen" role="status" aria-live="polite">
    <div class="splash-card">
      <img class="splash-icon" src="/iconos/android/mipmap-xxxhdpi/ic_launcher.png" width="192" height="192" alt="">
      <strong class="splash-title">Alerta Medicinas</strong>
      <div class="splash-bar" aria-hidden="true"><span></span></div>
      <p class="splash-message" id="splash-message">Preparando tus recordatorios</p>
      <button type="button" class="splash-reload" id="splash-reload" hidden>Recargar</button>
    </div>
  </section>
  <script>
    (function () {
      var ready = false;
      var reloadKey = "alerta_medicinas_splash_reload";
      var slowTimer = null;
      var reloadTimer = null;

      function $(id) {
        return document.getElementById(id);
      }

      function showProblem(message) {
        if (ready) return;
        var splash = $("splash-screen");
        var messageNode = $("splash-message");
        var reloadButton = $("splash-reload");
        if (splash) splash.classList.add("is-slow");
        if (messageNode) messageNode.textContent = message;
        if (reloadButton) reloadButton.hidden = false;
      }

      window.__alertaSplashDone = function () {
        ready = true;
        window.__alertaAppReady = true;
        clearTimeout(slowTimer);
        clearTimeout(reloadTimer);
        try {
          sessionStorage.removeItem(reloadKey);
        } catch (error) {
          /* sessionStorage can be disabled in private mode. */
        }
      };

      document.addEventListener("DOMContentLoaded", function () {
        var reloadButton = $("splash-reload");
        if (reloadButton) {
          reloadButton.addEventListener("click", function () {
            window.location.reload();
          });
        }
      });

      slowTimer = window.setTimeout(function () {
        showProblem("Esta tardando mas de lo normal.");
      }, 9000);

      reloadTimer = window.setTimeout(function () {
        if (ready || window.__alertaAppReady) return;
        try {
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, "1");
            window.location.reload();
            return;
          }
        } catch (error) {
          /* Keep the manual recovery path. */
        }
        showProblem("No pudo iniciar. Revisa tu conexion o recarga.");
      }, 18000);

      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    }());
  </script>
  <section class="auth-view" id="auth-view" hidden>
    <form class="auth-panel" id="auth-form">
      <p class="eyebrow" id="auth-eyebrow">Cuenta</p>
      <h1 id="auth-title">Entrar</h1>
      <label>
        <span>Usuario</span>
        <input id="auth-username" autocomplete="username" required>
      </label>
      <label id="name-field" hidden>
        <span>Nombre</span>
        <input id="auth-name" autocomplete="name">
      </label>
      <label>
        <span>Contrasena</span>
        <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <button class="primary" type="submit" id="auth-submit">Entrar</button>
      <p class="message" id="auth-message"></p>
    </form>
  </section>

  <section class="app-view" id="app-view" hidden>
    <header class="topbar">
      <div class="top-brand">
        <img src="/iconos/android/mipmap-xxxhdpi/ic_launcher.png" width="192" height="192" alt="">
        <div>
          <p class="eyebrow">Recordatorio</p>
          <h1>Alerta Medicinas</h1>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="push-button" class="push-switch" aria-pressed="false" aria-label="Activar notificaciones">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </button>
        <span id="push-status" class="sr-only">Listo para activar</span>
        <button type="button" id="logout-button" hidden>Salir</button>
      </div>
    </header>

    <main class="shell">
      <section class="panel treatment-panel" id="treatment-panel">
        <div class="form-heading">
          <div>
            <p class="eyebrow">Tratamiento</p>
            <h2 id="treatment-form-title">Nuevo tratamiento</h2>
          </div>
          <button type="button" id="treatment-close-form-button">Cerrar</button>
        </div>
        <form class="treatment-form" id="treatment-form">
          <input type="hidden" id="treatment-id">
          <label class="field-full">
            <span>Nombre</span>
            <input id="treatment-name" required placeholder="Antibiotico">
          </label>
          <label class="field-compact">
            <span>Fecha inicio</span>
            <input id="treatment-start-date" type="date" required>
          </label>
          <label class="field-compact">
            <span>Fecha termino opcional</span>
            <input id="treatment-end-date" type="date">
          </label>
          <div class="form-actions">
            <button class="primary" type="submit" id="treatment-save-button">Guardar</button>
          </div>
        </form>
      </section>

      <section class="panel medicine-panel" id="medicine-panel">
        <div class="form-heading">
          <div>
            <p class="eyebrow">Medicina</p>
            <h2 id="form-title">Nueva medicina</h2>
          </div>
          <button type="button" id="close-form-button">Cerrar</button>
        </div>
        <form class="medicine-form" id="medicine-form">
          <input type="hidden" id="medicine-id">
          <label class="field-full">
            <span>Nombre</span>
            <input id="medicine-name" required placeholder="Metformina">
          </label>
          <label class="field-full">
            <span>Dosis</span>
            <input id="medicine-dose" placeholder="1 tableta">
          </label>
          <label class="field-compact time-field">
            <span>Hora de inicio</span>
            <input id="medicine-start-time" type="time" required>
          </label>
          <label class="field-compact">
            <span>Cada horas</span>
            <input id="medicine-interval" type="number" min="1" max="168" required placeholder="8">
          </label>
          <label class="field-compact">
            <span>Por tantos dias</span>
            <input id="medicine-duration" type="number" min="1" max="3650" required placeholder="7">
          </label>
          <label class="field-full">
            <span>Notas opcional</span>
            <input id="medicine-notes" placeholder="Despues de comer">
          </label>
          <div class="form-actions">
            <button class="primary" type="submit" id="save-button">Guardar</button>
            <button type="button" id="cancel-edit" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      <div class="view-viewport">
        <div class="view-slider" id="view-slider">
          <section class="treatments-view" id="treatments-view">
            <div class="treatments-header">
              <div>
                <p class="eyebrow">Tratamientos</p>
                <h2>Mis tratamientos</h2>
              </div>
              <strong id="treatment-count">0 tratamientos</strong>
            </div>
            <section class="treatment-list" id="treatment-list"></section>
          </section>

          <section class="schedule-view" id="schedule-view">
            <div class="detail-header">
              <button type="button" id="back-to-treatments" class="back-button" aria-label="Volver a tratamientos">&lsaquo;</button>
              <div>
                <p class="eyebrow">Tratamiento</p>
                <h2 id="selected-treatment-name">Tratamiento</h2>
                <span id="selected-treatment-range"></span>
              </div>
            </div>
            <section class="medicine-list" id="medicine-list"></section>
          </section>
        </div>
      </div>
    </main>
    <button type="button" class="fab-button" id="fab-button" aria-label="Agregar tratamiento">+</button>
  </section>
</body>
</html>
